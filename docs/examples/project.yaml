# An example Feat project configuration.
#
# `feat project init` writes one of these by asking about the project, and finds
# out what it can — the checkout, its remote and default branch, the Compose
# files beside it — for itself. This file is for reading, for editing what that
# wrote, and for writing one by hand.
#
# Save it as ~/.config/feat/projects/<project-id>.yaml. The file name must match
# project.id, so this file belongs at ~/.config/feat/projects/app.yaml.
#
# Then:
#
#   feat doctor              validates this file and checks the host
#   feat project add app     registers the project with the daemon
#   feat project show app    prints the configuration Feat will act on
#
# Every field with a default is shown here with its default value, so that the
# file doubles as a reference. A minimal configuration needs only version,
# project, repositories, and agent.execution.mode.
#
# Editors that understand JSON Schema can be pointed at
# schema/feat-project.schema.json in this repository.

version: 1

project:
  id: app
  # Defaults to the identifier.
  name: Example Application
  # Where a task works by default. It must be a repository a task can edit.
  primary_repository: api

repositories:
  # An ordinary editable repository, which also brings part of the application.
  api:
    host_path: ~/repos/app/api

    # Where the agent's own container mounts this repository's task worktrees.
    # Required for every selectable repository when agent.execution.mode is
    # "devcontainer", and rejected under "host", which has no container.
    agent:
      container_path: /srv/api

    # What this repository contributes to the application. A runtime is composed
    # of its repositories: each brings its own Compose files, and Feat generates
    # the `include` document that joins them, with one project directory per
    # repository. Listing them all in one place instead would resolve every
    # relative path against one repository's directory, and this repository's
    # services would be built from another's.
    runtime:
      # Relative to the checkout above, which is also what relative paths inside
      # these files resolve against.
      compose_files:
        - docker-compose.yml
        - docker-compose.dev.yml
      # Where *these* services expect their source, which is a fact about these
      # Compose files rather than a choice. It is a different question from the
      # agent's mount above, and frequently a different answer: Feat mounts each
      # task worktree here, replacing what these files mounted at that path.
      container_path: /app
      # The services that run this repository's code. Feat starts, stops, and
      # destroys them for one task, and starts whatever they depend on.
      services:
        - app
        - worker
      # The ones you reach from this machine. Feat publishes each of them on a
      # host port it allocates for the task, reads the container port out of
      # these Compose files, and tells every managed service the address as
      # FEAT_HOST_URL_app and FEAT_HOST_PORT_app.
      reachable:
        - app

    default_branch: main
    remote: origin
    default_access: read_write

  # A repository the user chooses per task: omitted, read-only, or read-write.
  # It brings the other half of the application, from its own checkout.
  store:
    host_path: ~/repos/app/store
    agent:
      container_path: /srv/store
    runtime:
      compose_files:
        - docker-compose.dev.yml
      container_path: /srv
      services:
        - store
    default_branch: main
    remote: origin
    default_access: selectable

  # A repository that is normally used read-only from its ordinary checkout,
  # such as the one defining the devcontainer itself. It runs no service.
  infra:
    name: Container definitions
    host_path: ~/repos/app/infra
    agent:
      container_path: /srv/infra
    default_branch: main
    remote: origin
    default_access: stable_read_only

git:
  # remote resolves the base from the remote-tracking branch after a fetch.
  # Feat records the resulting commit, not the ref, and it never changes for
  # the lifetime of the task. Also available: local, current, explicit.
  base_policy: remote
  # Fetching never changes your ordinary checkout.
  fetch_before_task: true
  # Must contain {task_id} or {task_key}, or two tasks would share a branch.
  branch_template: "feat/{task_key}-{slug}"
  # Feat creates and removes task worktrees under this root, so the fixed part
  # of the path must be a directory Feat owns.
  worktree_root: "~/.local/share/feat/worktrees/{project_id}/{task_id}"

agent:
  provider: claude

  execution:
    # "devcontainer" runs the agent as a non-root user in a Compose service.
    # "host" runs it directly in the primary task worktree, with no container
    # boundary, and rejects the fields below.
    mode: devcontainer
    compose_files:
      - ~/repos/app/infra/docker-compose.yml
    service: dev
    # Must not be root.
    user: developer
    # Defaults to the primary repository's agent.container_path.
    working_directory: /srv/api
    # Where the task control workspace is mounted. It must not overlap a
    # repository mount.
    control_path: /feat

  claude:
    # A dedicated volume, so one interactive login is not the user's own
    # ~/.claude being exposed to every task container. Optional: leave it out
    # and Feat mounts nothing, leaving Claude's configuration to your own
    # Compose files.
    config_volume: feat-claude
    # Where that volume is mounted, and the value of CLAUDE_CONFIG_DIR. It must
    # not overlap a repository mount or the control path.
    config_path: /feat-claude
    # An end-of-turn signal becomes idle after this. Idle never means complete.
    idle_grace_period: 5s

  capabilities:
    # Docker is the whole section. It accepts one value: Feat has no mechanism
    # that grants an agent Docker, so any other value would be a promise the
    # binary does not keep. It is declared because a launch checks the
    # container against it, and `feat doctor` asks a running one the same
    # question. network and git were here until ADR-080; what they described is
    # in docs/05-security-model.md, which is where it held all along.
    docker: denied

# Omit this section entirely for a project with no application services. What
# the application is made of is on the repositories that bring it, above; what
# is here is the whole runtime's own settings.
runtime:
  provider: compose
  # In v0 services start only when you ask them to.
  start_policy: manual
  # Applied after Feat's generated include of the repositories' Compose files
  # and before its generated task override. Feat's Compose project directory is
  # its own generated directory, so write any path inside one of these absolute.
  static_overrides: []
  # Passed to Docker Compose by path. Feat never reads their contents, and
  # never copies a value out of them into anything it generates. Name every one
  # you need: Feat's project directory is its own, so Compose's implicit `.env`
  # lookup beside a repository does not apply.
  env_files:
    - ~/repos/app/api/.env
  # Must contain {task_id} or {task_key}: the Compose project name is what
  # makes a runtime action affect one task and no other.
  project_name_template: "feat-{project_id}-{task_id}"
  # The host ports the reachable services above are published on. Feat allocates
  # one per reachable service per task and releases them when that task's
  # runtime is destroyed, which is what lets several tasks run the whole
  # application at once: a port written into a Compose file is global to the
  # machine, so the second task could never bind it. The published ports of
  # every other service are removed for the same reason.
  port_range: "21000-21999"
  # Feat sets FEAT_PROJECT_ID, FEAT_TASK_ID, FEAT_TASK_KEY, and
  # FEAT_RUNTIME_PROJECT on every managed service, and FEAT_HOST_URL_<service>
  # and FEAT_HOST_PORT_<service> for each reachable one — upper-cased, with
  # everything that is not a letter or a digit replaced. They carry the address
  # a consumer on this machine reaches the service at — a browser, a curl, or a
  # build baking an API address into a bundle a browser then loads — and the
  # port differs per task, so nothing baked into an image can name it. Read one
  # in the service itself, or map it to your own name in your Compose file with
  # "${FEAT_HOST_URL_app}".
  #
  # HOST is in the name because a published port belongs to this machine's
  # network namespace. Read inside a container that address is the container's
  # own loopback, so it is not how one service calls another: for that, name the
  # Compose service and the container port, which do not differ per task.
  #
  # An application that shares an external resource between tasks — a staging
  # database on its own server, say — names its share with FEAT_TASK_KEY. Feat
  # neither knows nor asks what is behind the name: the connection string lives
  # in an env_file it never opens.

# Verification commands, per repository.
checks:
  api:
    - id: test
      command: ["pytest"]
      # agent runs it in the agent's environment; host runs it on this machine.
      execution: agent
