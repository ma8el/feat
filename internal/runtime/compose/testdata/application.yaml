# An application definition for the opt-in tests, deliberately awkward.
#
# It carries a fixed container name and a fixed published port, both of which are
# global — a name to the Docker daemon, a port to the host — and both of which
# the generated override must replace, so that two tasks can run these services
# at once. The dependency below carries a fixed port of its own, because a
# service nobody named holds one just as firmly as the entry point does.
#
# Neither fixed port is ever bound when Feat is working: a task publishes what
# was allocated for it, and a service that was not declared reachable publishes
# nothing. A test that finds one of them bound has found the failure this fixture
# exists for.
#
# It also mounts a directory at the path a task worktree will be mounted at, so
# that Compose's merge-by-target behaviour is proved against real Docker rather
# than assumed. That is the mechanism the whole mount design rests on.
#
# Only `api` is a managed service. The other two are the ordinary shape of a real
# application — something that must be up, and something that must have finished
# — and Compose starts both because `api` says so. They carry fixed names of
# their own, so a test that starts two tasks proves the generated override
# reaches a service the project never named.
#
# The one-shot dependency is built rather than pulled, because that is the other
# ordinary shape: a migration built from the application's own Dockerfile. Its
# image is named after the Compose project, so it does not exist until something
# builds it, and on a fresh task nothing has (ADR-034 evidence 13).
services:
  api:
    image: alpine:3.20
    # An application service that stays up, so that "running" is a state the
    # tests can observe rather than a race with the container's own exit.
    command: ["sleep", "infinity"]
    container_name: feat-runtime-test-fixed-name
    ports:
      - "24999:80"
    volumes:
      - ./base-mount:/srv/api
    depends_on:
      store:
        condition: service_started
      prepare:
        condition: service_completed_successfully

  store:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    container_name: feat-runtime-test-dependency
    ports:
      - "24998:80"

  # A one-shot dependency: it does its job and exits, which is what a migration
  # looks like and what the aggregation table must not read as a broken
  # application.
  prepare:
    build:
      context: .
      dockerfile: prepare.Dockerfile
    command: ["true"]
    container_name: feat-runtime-test-one-shot
    restart: "no"
