# A complete, valid project configuration.
#
# The repository names here are deliberately generic: nothing about the
# reference project may reach the binary or its tests (CLAUDE.md scope rule 3).
version: 1

project:
  id: app
  name: Example Application
  primary_repository: api

repositories:
  api:
    host_path: ~/repos/app/api
    # Where the agent's own container mounts this repository's task worktrees.
    agent:
      container_path: /srv/api
    # What this repository brings to the application, and where its own services
    # expect its source. The two paths are different questions with different
    # owners, so they are different fields.
    runtime:
      compose_files:
        - docker-compose.yml
      container_path: /app
      services:
        - app
        - worker
      reachable:
        - app
    # Where this repository's merge requests are opened. It is declared rather
    # than guessed: a self-hosted instance is not recognisable from its remote.
    forge:
      kind: gitlab
    default_branch: main
    remote: origin
    default_access: read_write

  web:
    host_path: ~/repos/app/web
    agent:
      container_path: /srv/web
    default_branch: main
    remote: origin
    default_access: selectable

  infra:
    name: Container definitions
    host_path: ~/repos/app/infra
    agent:
      container_path: /srv/infra
    default_branch: main
    remote: origin
    default_access: stable_read_only

git:
  base_policy: remote
  fetch_before_task: true
  branch_template: "feat/{task_key}-{slug}"
  worktree_root: "~/.local/share/feat/worktrees/{project_id}/{task_id}"

agent:
  provider: claude
  execution:
    mode: devcontainer
    compose_files:
      - ~/repos/app/infra/docker-compose.yml
    service: dev
    user: developer
    working_directory: /srv/api
    control_path: /feat

  claude:
    config_volume: example-claude-config
    idle_grace_period: 5s

  capabilities:
    docker: denied
    network: unrestricted
    git: full

runtime:
  provider: compose
  start_policy: manual
  static_overrides: []
  env_files:
    - ~/repos/app/api/.env
  project_name_template: "feat-{project_id}-{task_id}"

review:
  diff:
    command: ["git", "diff", "{base_commit}"]
  editor:
    command: ["nvim", "{repository_path}"]
  status:
    command: ["git", "status", "--short", "--branch"]

checks:
  api:
    - id: test
      command: ["pytest"]
      execution: agent

tracker:
  kind: command
  # Whatever prints this project's tickets as JSON in the shape of
  # schema/feat-tickets.schema.json. Feat passes no filter of its own: which
  # tickets are the user's is the command's decision.
  command: ["tickets-for-me"]

notifications:
  desktop: true
  idle_grace_period: 5s
  suppress_while_attached: true
