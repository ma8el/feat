# The same fixture, granted more than its mounts.
#
# Two lines, either of which a project adds to make a nested-tooling or FUSE
# case work, and neither of which appears in the mounts or the environment the
# launch check used to read. A container with CAP_SYS_ADMIN remounts the
# read-only control workspace read-write, which is the mechanism the residual
# guarantee of the round-1 control-workspace fix rests on (G7-05, G4-04).
#
# The container is `sleep infinity` with nothing in it: what is being proved is
# that `docker inspect` reports these under .HostConfig and that the check reads
# them, not that the capability works — it does.
services:
  dev:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    user: "1000:1000"
    container_name: feat-test-fixed-name
    privileged: true
    cap_add:
      - SYS_ADMIN
    ports:
      - "59317:80"
    volumes:
      - ./base-mount:/srv/api
