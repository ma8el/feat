name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify the module is tidy
        run: go mod tidy -diff

      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The opt-in tests use the real tools: they build and run the binary, and
      # they drive real Git, tmux, and Docker Compose. Unit tests must do none,
      # so these are a separate step rather than a separate workflow.
      #
      # Slice 2 acceptance: two client processes query the daemon concurrently.
      # Slice 3: the diagnostic commands are argument vectors a fake runner
      # cannot check, so they are also run against the tools themselves.
      - name: Install tmux when the runner image does not provide it
        shell: bash
        run: |
          if command -v tmux >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes tmux
          else
            brew install tmux
          fi

      # -count=1 for the reason the Makefile gives (ADR-035 evidence 13): -run is
      # a cacheable flag, and the test cache tracks nothing these tests observe
      # through a subprocess — docker info, tmux server state, git output, the
      # built binary's conduct. Without it a re-run requested precisely to
      # re-exercise the tools can replay a cached PASS and exercise none.
      #
      # FEAT_INTEGRATION_REQUIRE names the tools this leg demands: a demanded
      # tool that is missing or unanswering fails the step rather than skipping
      # it, because a package whose selected tests all skipped still prints
      # "ok". The macOS runner image ships no Docker daemon, so that leg proves
      # less — and now says which proofs it is not making, in this file, rather
      # than by going green.
      - name: Test with the real tools
        run: |
          tmux -V
          go test -race -count=1 -run 'TestBinary|TestReal' ./...
        env:
          FEAT_INTEGRATION: "1"
          FEAT_INTEGRATION_REQUIRE: ${{ runner.os == 'Linux' && 'git,docker,tmux' || 'git,tmux' }}

      # Slice 0 acceptance: one binary, and `feat --help` shows the intended
      # command model. The command surface itself is pinned by a golden test.
      - name: Build the binary
        run: go build -o feat ./cmd/feat

      - name: Show the command surface
        run: ./feat --help

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # .golangci-version is the single source for the pinned linter version,
      # shared with the Makefile.
      - name: Read the pinned golangci-lint version
        id: pinned
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.pinned.outputs.version }}
          args: --timeout=5m

      # `golangci-lint run` does not check formatters in v2, so formatting needs
      # its own step. The action puts the pinned binary on PATH.
      - name: Check formatting
        run: golangci-lint fmt --diff
