name: Release

# Pushing a tag is the whole release procedure. The workflow runs on the tag
# rather than on a branch so that what is published is exactly the commit the
# tag names, and so that nothing else can publish.
on:
  push:
    tags:
      - "v*"

# GoReleaser creates the GitHub release and uploads the archives and the
# checksums file to it. That is the only write this workflow makes.
permissions:
  contents: write

jobs:
  release:
    name: release
    # .goreleaser.yaml builds darwin/amd64 and darwin/arm64 and nothing else, so
    # the archives are built on the platform they are for.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # GoReleaser reads history: the previous tag for the changelog, and
          # the tag itself for the version and the commit date it stamps into
          # the binary. The ancestry check below reads main. A shallow clone has
          # neither.
          fetch-depth: 0

      # This job deliberately does not repeat CI's real-tool leg, and the reason
      # is stronger than speed: GitHub's macOS images ship no Docker daemon —
      # ci.yml says so where it demands only git,tmux there — so repeating the
      # leg on this runner would be partial by construction and would prove less
      # than the Linux run that already happened on main.
      #
      # What protects a tag is instead that it points at a commit main's CI has
      # tested. Assert that premise rather than assume it. It proves the commit
      # is on main, which is where CI runs, rather than waiting for a particular
      # run; what it catches is the real mistake, which is tagging a branch.
      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "the tagged commit $GITHUB_SHA is not on origin/main, so no CI run has tested it" >&2
            echo "delete the tag, merge the work into main, and tag the commit main carries" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Build, vet, and the unit tests before anything is published, with the
      # same commands ci.yml runs, so that a broken tag fails loudly here rather
      # than shipping.
      - name: Build all packages
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # .goreleaser-version is the single source for the pinned releaser, shared
      # with the Makefile, which is why this reads the file rather than naming a
      # version of its own. Same shape as ci.yml's .golangci-version step.
      #
      # It is read before the validation below as well as the publish, because
      # both steps take the releaser from here.
      - name: Read the pinned GoReleaser version
        id: pinned
        run: echo "version=$(cat .goreleaser-version)" >> "$GITHUB_OUTPUT"

      # `goreleaser check` through the action rather than through `make
      # release-check`, which is the same command locally but not here.
      #
      # The Makefile builds its tools with `go install`, and the Go this job
      # gets is the one go.mod names — 1.26.0, with setup-go pinning
      # GOTOOLCHAIN=local so that stays exact. The releaser needs 1.26.5 to
      # build, so the install failed on a runner while working on a machine that
      # happens to run a newer Go. The action downloads the released binary
      # instead and needs no toolchain at all, which is also what the publish
      # step below has always done: the job was installing the same releaser
      # twice, and only the half that compiled it could break.
      #
      # Raising go.mod would have fixed this too, and would have raised the Go a
      # user needs to build Feat in order to satisfy the tool that packages it.
      # Those are two requirements and only one of them belongs in go.mod.
      - name: Validate the release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.pinned.outputs.version }}
          args: check

      # The release is published as a pre-release, and that is set in
      # .goreleaser.yaml rather than here: `goreleaser release` has a --draft
      # flag and no --prerelease, so no workflow can pass it.
      #
      # --clean empties dist/ first, so what is uploaded is what this run
      # produced. GITHUB_TOKEN is what creates the release and uploads to it,
      # and is what the contents: write above is for.
      - name: Build and publish the release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.pinned.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
