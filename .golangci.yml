# Lint configuration for Feat.
#
# The depguard rules below are the executable form of the architectural and
# security rules in CLAUDE.md. Changing one of them is a change to the
# architecture, not a lint preference.
#
# The pinned linter version lives in .golangci-version, which the Makefile and
# CI both read.

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert

  settings:
    depguard:
      rules:
        # "Keep domain types independent of Claude, tmux, Docker, GitHub,
        # GitLab, and Bubble Tea." The domain is the one package that must stay
        # portable across every adapter we add later.
        domain-stays-provider-neutral:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/ma8el/feat/internal
              desc: the domain depends on nothing inside feat; adapters depend on the domain
            - pkg: github.com/charmbracelet
              desc: the domain must not know about the TUI
            - pkg: github.com/spf13
              desc: the domain must not know about the CLI
            - pkg: os/exec
              desc: the domain describes state; adapters run processes

        # Configuration validation must be testable without a host environment,
        # so it may not reach for Git, tmux, Docker, or a terminal.
        config-stays-testable:
          files:
            - "**/internal/config/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
              desc: configuration describes the agent; it does not drive it
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # "Storage code contains no daemon/TUI dependencies"
        # (docs/11-implementation-plan.md, slice 1 acceptance criteria).
        storage-stays-independent:
          files:
            - "**/internal/store/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-029: the Git adapter works on domain types and final names. It
        # never learns the shape of a YAML file — the daemon expands templates,
        # because the placeholder vocabulary belongs to configuration — and it
        # never reaches persistent state, because the daemon records what the
        # adapter creates.
        git-stays-an-adapter:
          files:
            - "**/internal/git/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon expands templates and hands the adapter final names
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-030: tmux owns persistent terminal topology and accepts final
        # command vectors. Execution environments construct those vectors; the
        # daemon records targets. The adapter therefore needs only domain IDs
        # and target types, never configuration, storage, or another adapter.
        tmux-stays-an-adapter:
          files:
            - "**/internal/tmux/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
              desc: execution adapters supply final commands; tmux preserves their terminals
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-032: the agent packages are adapters under the rule ADR-029
        # established for Git. They receive final values — the daemon reads
        # configuration and expands it — and they never reach persistent state,
        # because the daemon records what they report. internal/control is a
        # protocol implementation under the same rule: it owns a file format and
        # knows nothing about who reads it.
        agent-stays-an-adapter:
          files:
            - "**/internal/agent/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon reads configuration and hands the adapter final values
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
              desc: an agent adapter describes a launch; the terminal backend runs it
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-033: an execution environment receives final values — absolute
        # Compose files, a project name, a service, a user, mounts, and labels —
        # and reads neither configuration nor persistent state. It also knows no
        # provider: the agent adapter describes a launch in its own environment's
        # terms, and the execution adapter wraps that launch without reading it.
        execution-stays-an-adapter:
          files:
            - "**/internal/execution/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
              desc: an execution environment wraps a launch; it never interprets one
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon reads configuration and hands the adapter final values
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
              desc: the agent's environment and the application runtime are separate concepts
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
              desc: an execution adapter builds a command; the terminal backend runs it
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-034: the application runtime receives final values — absolute
        # Compose files, a project name, services, mounts, and labels — and reads
        # neither configuration nor persistent state, exactly as the execution
        # adapter does. It is denied internal/execution as well, because the
        # agent's environment and the application under development are separate
        # concepts even where both drive Docker Compose (CLAUDE.md), and the
        # Compose plumbing is deliberately duplicated rather than shared.
        runtime-stays-an-adapter:
          files:
            - "**/internal/runtime/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon reads configuration and hands the adapter final values
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
              desc: the application runtime and the agent's environment are separate concepts
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-035: the resource observer receives final values — process
        # identifiers, a label selector, a filesystem path — and reads neither
        # configuration nor persistent state, under the rule ADR-029 established
        # for Git. It is denied both Compose adapters as well, and that is the
        # point of it: an agent's container and an application's are the same
        # thing to a resource observer, and a package that could tell them apart
        # would eventually be asked to treat them differently.
        resources-stays-an-adapter:
          files:
            - "**/internal/resources/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon reads configuration and hands the adapter final values
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
              desc: an agent's container and an application's are both containers here
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
              desc: the daemon resolves which processes a task owns
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-036: review decides whether an expanded command may run and runs a
        # project's configured checks. The daemon expands the templates, because
        # the placeholder vocabulary belongs to configuration, and the daemon
        # records what a gate produced. The Git answers a review shows come from
        # internal/git, so this package never learns what a worktree is beyond a
        # path it was handed.
        review-stays-a-policy:
          files:
            - "**/internal/review/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon expands templates and hands this package final values
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
              desc: a gate runs a command through a Runner; where that is is the daemon's to decide
            - pkg: github.com/ma8el/feat/internal/git
              desc: change summaries are Git's own answers and belong to its adapter
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # ADR-035: the notification policy decides what is worth interrupting
        # somebody for, in domain terms, and its platform adapters deliver. It
        # reads no configuration — the daemon resolves a project's settings into
        # a Policy — and it can reach nothing a task's content could come from,
        # which is what keeps "notifications identify a task without exposing its
        # content" a property of the code rather than a rule to remember.
        notify-stays-a-policy:
          files:
            - "**/internal/notify/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
              desc: the daemon resolves a project's notification settings into a policy
            - pkg: github.com/ma8el/feat/internal/control
              desc: a control message is where an agent's own words would come from
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
              desc: the daemon asks tmux whether a task is being watched
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        control-stays-a-protocol:
          files:
            - "**/internal/control/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
              desc: a provider adapter reads the protocol; the protocol knows no provider
            - pkg: github.com/ma8el/feat/internal/api
            - pkg: github.com/ma8el/feat/internal/cli
            - pkg: github.com/ma8el/feat/internal/client
            - pkg: github.com/ma8el/feat/internal/config
            - pkg: github.com/ma8el/feat/internal/daemon
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/ma8el/feat/internal/ui
            - pkg: github.com/charmbracelet
            - pkg: github.com/spf13/cobra

        # The TUI is a client. It renders daemon state and never touches
        # persistent state or an adapter directly.
        ui-is-a-client:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/daemon
              desc: the TUI reaches the daemon over the socket, not in process
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux

        # ADR-027: internal/api is the transport and internal/client is its
        # counterpart. Neither may read persistent state or drive an adapter,
        # and neither may import the daemon: the daemon implements the API's
        # Service interface, so the dependency points the other way.
        transport-stays-transport:
          files:
            - "**/internal/api/**"
            - "**/internal/client/**"
            # Tests may use the shared fixtures in internal/store/storetest, as
            # the same rule in internal/guard allows. Production code may not.
            - "!$test"
          deny:
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/daemon
              desc: the daemon implements the API's Service interface, not the reverse
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/project
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/tmux
            - pkg: github.com/charmbracelet
              desc: the transport carries state; rendering it is the TUI's job

        # The CLI is a client too, but it may start the daemon, so
        # internal/daemon is deliberately absent from this list.
        cli-is-a-client:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/ma8el/feat/internal/agent
            - pkg: github.com/ma8el/feat/internal/control
            - pkg: github.com/ma8el/feat/internal/execution
            - pkg: github.com/ma8el/feat/internal/git
            - pkg: github.com/ma8el/feat/internal/notify
            - pkg: github.com/ma8el/feat/internal/reconcile
            - pkg: github.com/ma8el/feat/internal/resources
            - pkg: github.com/ma8el/feat/internal/runtime
            - pkg: github.com/ma8el/feat/internal/store
              desc: the daemon is the only reader and writer of persistent state
            - pkg: github.com/ma8el/feat/internal/tmux

        # ADR-013: invoke the Docker Compose CLI. Linking a Docker SDK would
        # make it far easier to accidentally grant the agent Docker reach.
        no-docker-sdk:
          files:
            - $all
          deny:
            - pkg: github.com/docker
              desc: use the Docker Compose CLI through argument vectors (ADR-013)
            - pkg: github.com/moby
              desc: use the Docker Compose CLI through argument vectors (ADR-013)

        # Spawning processes belongs in adapters, where the argument-vector and
        # capability rules are stated and tested.
        process-execution-stays-in-adapters:
          files:
            - $all
            - "!$test"
            - "!**/internal/agent/**"
            - "!**/internal/cli/**"
            - "!**/internal/daemon/**"
            - "!**/internal/execution/**"
            - "!**/internal/git/**"
            - "!**/internal/notify/**"
            - "!**/internal/project/**"
            - "!**/internal/resources/**"
            - "!**/internal/review/**"
            - "!**/internal/runtime/**"
            - "!**/internal/tmux/**"
          deny:
            - pkg: os/exec
              desc: run processes from an adapter package, using an argument vector

    revive:
      rules:
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    rules:
      # Test fixtures use permissive file modes and predictable paths on
      # purpose; neither reaches a user's machine.
      - path: _test\.go
        linters:
          - gosec

      # The daemon opens the files internal/paths resolved, in a directory whose
      # ownership and mode it validated first, and starts exactly one process:
      # this binary, running its own foreground command. Both are the purpose of
      # these files, and gosec cannot see the validation that precedes them. The
      # exemption is recorded here rather than in //nolint comments so that it
      # stays visible in one reviewable place (ADR-025).
      - path: internal/daemon/(endpoint|logging|spawn|platform_unix)\.go
        linters:
          - gosec
        text: G304|G204

      # internal/config opens the configuration file it was asked for, whose
      # name is a project identifier the domain validated before it was joined
      # into a path, and internal/project runs the diagnostic commands that are
      # the package's whole purpose, always as argument vectors and never
      # through a shell. gosec sees the variable and not the validation, so
      # these two exemptions are recorded here rather than in //nolint
      # comments, for the reason ADR-025 gives.
      - path: internal/(config/parse|project/runner)\.go
        linters:
          - gosec
        text: G304|G204

      # internal/control opens the files of a control workspace whose path is
      # built from identifiers the domain validated, under a root the daemon
      # resolved, and whose names it checked to be plain files in that one
      # directory. internal/agent runs the probe commands that are the point of
      # validating an execution environment, always as argument vectors and
      # never through a shell. gosec sees the variable and not the check that
      # precedes it, so both exemptions are recorded here rather than in
      # //nolint comments, for the reason ADR-025 gives.
      - path: internal/(control/(poll|workspace)|agent/runner)\.go
        linters:
          - gosec
        text: G304|G204

      # internal/execution/compose runs Docker, which is the package's whole
      # purpose, always as an argument vector and never through a shell, and
      # writes the generated override into a directory the daemon resolved.
      # Only the trusted host ever runs Docker; the agent's container receives
      # neither a socket nor a client, which this package refuses a launch over.
      # gosec sees the variable and not the validation, so the exemption is
      # recorded here rather than in //nolint comments, for the reason ADR-025
      # gives.
      - path: internal/execution/compose/(runner|override)\.go
        linters:
          - gosec
        text: G304|G204

      # internal/runtime drives Docker Compose for the application under
      # development, which is the package's whole purpose, always as an argument
      # vector and never through a shell, and writes the generated override into
      # a directory the daemon resolved. Only the trusted host ever runs Docker;
      # the agent receives no socket and no client whatever the user starts here.
      # gosec sees the variable and not the validation, so the exemption is
      # recorded here rather than in //nolint comments, for the reason ADR-025
      # gives.
      - path: internal/runtime/(runner|compose/override)\.go
        linters:
          - gosec
        text: G304|G204

      # internal/resources runs the observation commands that are the package's
      # whole purpose, and internal/notify runs macOS's own script runner to
      # deliver a notification. Both are argument vectors and neither reaches a
      # shell: the notification's text is read out of argv by the script rather
      # than pasted into it, which is what stops a task title containing a
      # quotation mark from becoming script. gosec sees a variable argument and
      # not the check that precedes it, so the exemption is recorded here rather
      # than in //nolint comments, for the reason ADR-025 gives.
      - path: internal/(resources/runner|notify/notify_darwin)\.go
        linters:
          - gosec
        text: G204

      # internal/git runs Git, which is the package's whole purpose, always as
      # an argument vector and never through a shell. The directories it
      # creates above a task worktree are traversable on purpose: they hold
      # repository working trees rather than secrets, and in devcontainer
      # execution a second user has to reach the mount through them. Both are
      # recorded here rather than in //nolint comments, for the reason ADR-025
      # gives.
      - path: internal/git/(runner|apply)\.go
        linters:
          - gosec
        text: G204|G301

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ma8el/feat
